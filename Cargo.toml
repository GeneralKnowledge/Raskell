[package]
name = "raskell"
version = "0.1.0"
edition = "2021"
description = "A Rust-to-Haskell transpiler that understands Rust semantics and emits idiomatic Haskell"
license = "MIT"
readme = "README.md"
keywords = ["rust", "haskell", "transpiler", "compiler"]
categories = ["compilers", "development-tools"]
rust-version = "1.83"
autobins = false
autoexamples = false
autotests = true
autobenches = false

[[bin]]
name = "raskell"
path = "src/main.rs"

[dependencies]
syn = { version = "=2.0.87", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "=1.0.37"
proc-macro2 = { version = "=1.0.89", features = ["span-locations"] }
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "=1.0.64"
anyhow = "=1.0.89"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
heck = "=0.5.0"
indexmap = { version = "=2.6.0", features = ["std"] }
prettyplease = "=0.2.22"

[dev-dependencies]
tempfile = "=3.13.0"
pretty_assertions = "=1.4.1"
walkdir = "=2.5.0"

# Force older getrandom for Rust 1.83 compatibility in the dependency graph
[dependencies.getrandom]
version = "=0.2.15"
optional = true

[profile.test]
opt-level = 1
